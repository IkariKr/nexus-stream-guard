events {}

http {
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" "";
  }

  map $http_origin $cors_allow_origin {
    default "";
    "~^https://nexus-admin\\.ikarikore\\.top$" $http_origin;
  }

  map $http_x_forwarded_proto $force_https {
    default 0;
    http 1;
    https 0;
  }

  map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    http http;
    https https;
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    server_name _;
    set $upstream_host cli-proxy-api;
    set $stream_guard_host cliproxyapi-stream-guard;

    if ($force_https) {
      return 301 https://$host$request_uri;
    }

    client_max_body_size 50m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    keepalive_timeout 3600s;
    send_timeout 3600s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Exact match for /v1/responses only: routed to Stream Guard sidecar
    location = /v1/responses {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        add_header Content-Length 0;
        add_header Content-Type "text/plain; charset=utf-8";
        return 204;
      }

      proxy_pass http://$stream_guard_host:18318;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;

      if ($cors_allow_origin != "") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Vary "Origin" always;
      }
    }

    location = /v1 {
      proxy_pass http://$upstream_host:8317;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;

      if ($cors_allow_origin != "") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Vary "Origin" always;
      }
    }

    location = /v1/ {
      return 308 /v1;
    }

    # Prefix match for all other /v1/* endpoints (chat/completions, messages, models, etc.):
    # 100% direct to CLIProxyAPI, completely bypassing Stream Guard
    location ^~ /v1/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;
        add_header Content-Length 0;
        add_header Content-Type "text/plain; charset=utf-8";
        return 204;
      }

      proxy_pass http://$upstream_host:8317;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding on;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Credentials;
      proxy_hide_header Access-Control-Expose-Headers;

      if ($cors_allow_origin != "") {
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Vary "Origin" always;
      }
    }

    location / {
      return 404;
    }
  }
}
